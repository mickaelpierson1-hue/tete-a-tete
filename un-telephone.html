<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tête-à-Tête Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  /* Plan : une affiche de combat coupée en deux aplats, bleu en haut, jaune en bas, séparés par un filet noir qui sert de chrono. Chaque moitié appartient à un joueur. */
  --jaune:#ffc93c;--bleu:#62b6ff;--encre:#15161c;--papier:#fffaf0;--ok:#2fcf7f;--ko:#ff5c61;
  --display:"Anton","Arial Narrow",Impact,sans-serif;
  --body:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{overflow:hidden;overscroll-behavior:none;background:var(--encre);color:var(--encre);font:600 17px/1.25 var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--encre);outline-offset:2px}
.d{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden}

/* Accueil */
#home{position:absolute;inset:0;overflow:auto;display:grid;grid-template-rows:auto auto 1fr}
.corner{display:grid;gap:12px;align-content:start;padding:18px 20px 22px}
.corner.b{background:var(--bleu)}
.corner.a{background:var(--jaune)}
.band{background:var(--encre);color:var(--papier);padding:14px 20px 18px}
h1{font-size:clamp(44px,15.5vw,80px)}
.band p{margin-top:8px;font-weight:500;font-size:16px;max-width:40ch}
.name{display:grid;gap:5px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
input{width:100%;padding:8px 12px;border:3px solid var(--encre);border-radius:6px;background:var(--papier);color:var(--encre);font:400 28px/1.25 var(--display);text-transform:uppercase;letter-spacing:.02em;-webkit-user-select:text;user-select:text}
input::placeholder{color:var(--encre);opacity:.35}
.seg{display:grid;grid-template-columns:1fr 1fr;border:3px solid var(--encre);border-radius:6px;overflow:hidden;background:var(--papier)}
.seg button{padding:11px 6px;font-weight:700;font-size:16px}
.seg button.on{background:var(--encre);color:var(--papier)}
#start{padding:12px;border-radius:6px;background:var(--encre);color:var(--jaune);font-size:36px;letter-spacing:.05em}
#start:active{transform:translateY(2px)}
.how{font-weight:500;font-size:15px;max-width:46ch}

/* Partie */
#game{position:absolute;inset:0;display:grid;grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);touch-action:none}
.half{display:flex;flex-direction:column;gap:8px;min-height:0;padding:8px 14px 14px;background:var(--jaune)}
.half[data-p="1"]{background:var(--bleu)}
.face .half[data-p="1"]{transform:rotate(180deg)}
.half header{display:flex;align-items:flex-end;gap:10px}
.nm{font-size:20px;padding-bottom:3px}
.sc{font-size:36px;font-variant-numeric:tabular-nums}
.fl{font-size:20px;padding-bottom:5px}
.side{margin-left:auto;text-align:right;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1.3}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.chip{align-self:flex-start;display:inline-flex;align-items:center;min-height:28px;padding:2px 10px;border:3px solid var(--encre);border-radius:4px;background:var(--encre);color:var(--papier);font-size:13.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.chip.up,.chip.dn{color:var(--encre);font:400 17px/1 var(--display);letter-spacing:.03em}
.chip.up{background:var(--ok)}
.chip.dn{background:var(--ko)}
.q,.rule{flex:1;min-height:0;display:flex;align-items:center;font-size:clamp(16px,2.9vh,23px);font-weight:700;line-height:1.18;text-wrap:balance}
.rule{align-items:flex-start;font-weight:600;font-size:clamp(15px,2.5vh,19px);line-height:1.25}
.ttl{font-size:clamp(30px,6vh,52px);text-wrap:balance}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ans button,.val button{background:var(--papier);border:3px solid var(--encre);border-radius:6px;box-shadow:0 3px 0 var(--encre)}
.ans button{min-height:clamp(44px,7.4vh,66px);padding:4px 8px;font-weight:700;font-size:clamp(15px,2.35vh,19px);line-height:1.1;text-wrap:balance}
.ans button:active,.val button:active{transform:translateY(3px);box-shadow:none}
.ans.tf button,.ans.three button{min-height:clamp(60px,10.5vh,96px);font:400 clamp(26px,4.4vh,36px)/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.ans.three{grid-template-columns:repeat(3,1fr)}
.ans.wait button{background:var(--encre);color:transparent;box-shadow:none;transform:translateY(3px)}
.ans.lock button{pointer-events:none;box-shadow:none;transform:translateY(3px)}
.ans.lock button:not(.ok):not(.ko){opacity:.4}
.ans button.ok{background:var(--ok);animation:pop .4s}
.ans button.ko{background:var(--ko)}
.ans button.out{opacity:.35;text-decoration:line-through;pointer-events:none;box-shadow:none}
.val{display:flex;align-items:center;gap:10px}
.val button{width:58px;height:42px;font:700 30px/1 var(--body)}
.val output{flex:1;text-align:center;font:400 clamp(30px,5.6vh,46px)/1 var(--display);font-variant-numeric:tabular-nums}
.trk{position:relative;height:38px;margin:0 16px}
.trk::before{content:"";position:absolute;left:-16px;right:-16px;top:15px;height:8px;border-radius:4px;background:var(--encre)}
.trk i{position:absolute;top:3px;width:32px;height:32px;margin-left:-16px;border-radius:50%;background:var(--papier);border:3px solid var(--encre);box-shadow:0 3px 0 var(--encre)}
.trk u{position:absolute;top:0;width:12px;height:38px;margin-left:-6px;border-radius:3px;background:var(--ok);border:3px solid var(--encre)}
.lk .trk i,.lk .val button{opacity:.6}
.go{min-height:48px;padding:8px 12px;border-radius:6px;background:var(--encre);color:var(--papier);font:400 24px/1 var(--display);text-transform:uppercase;letter-spacing:.05em}
.go.done{opacity:.5}
.sol{min-height:48px;display:grid;place-items:center;border:3px solid var(--encre);border-radius:6px;background:var(--ok);font-size:24px}

/* Filet central : chrono et pause */
#net{position:relative;height:36px;display:grid;place-items:center;background:var(--encre)}
#tb{position:absolute;left:14px;right:14px;top:14px;height:8px;border-radius:4px;background:var(--papier);transform:scaleX(0)}
#tb.hot{background:var(--ko)}
#tb.idle{opacity:.4}
#pz{position:relative;width:46px;height:28px;border-radius:14px;background:var(--papier);border:3px solid var(--encre);display:grid;place-items:center}
#pz::before{content:"";width:12px;height:12px;border-left:4px solid var(--encre);border-right:4px solid var(--encre)}
#pov{position:absolute;inset:0;z-index:5;display:none;place-items:center;background:rgba(21,22,28,.88)}
.paused #pov{display:grid}
#pov>div{display:grid;gap:12px;width:min(300px,84%);padding:22px;border-radius:8px;background:var(--papier);text-align:center}
.lnk{padding:10px;font-weight:700;text-decoration:underline}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.sc.bump{animation:pop .4s}
@media (max-height:620px){.half{gap:5px;padding:6px 12px 8px}.body{gap:6px}.sc{font-size:28px}.go,.sol{min-height:42px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app">
<main id="home">
  <section class="corner b">
    <label class="name" for="n1">Coin bleu · haut de l’écran
      <input id="n1" maxlength="12" placeholder="Joueur 2" autocomplete="off" enterkeyhint="done">
    </label>
  </section>
  <section class="band">
    <h1 class="d">Tête-à-tête</h1>
    <p>Le quiz en duel sur un seul téléphone. Six manches, douze thèmes, un gage pour le perdant.</p>
  </section>
  <section class="corner a">
    <label class="name" for="n0">Coin jaune · bas de l’écran
      <input id="n0" maxlength="12" placeholder="Joueur 1" autocomplete="off" enterkeyhint="done">
    </label>
    <div class="seg" data-k="f" role="group" aria-label="Durée de la partie"><button id="f1" data-v="1">Classique · 20 min</button><button id="f2" data-v="0.5">Express · 10 min</button></div>
    <div class="seg" data-k="face" role="group" aria-label="Placement des joueurs"><button id="p1" data-v="1">Face à face</button><button id="p2" data-v="0">Côte à côte</button></div>
    <div class="seg" data-k="snd" role="group" aria-label="Son"><button id="s1" data-v="1">Son activé</button><button id="s2" data-v="0">Muet</button></div>
    <button id="start" class="d">Jouer</button>
    <p class="how">Posez le téléphone à plat entre vous. Chacun répond sur sa moitié d’écran. En face à face, la moitié bleue est tournée vers le joueur d’en face.</p>
  </section>
</main>
<div id="game" hidden>
  <section class="half" data-p="1"></section>
  <div id="net"><div id="tb"></div><button id="pz" data-a="pz" aria-label="Pause"></button></div>
  <section class="half" data-p="0"></section>
  <div id="pov"><div><p class="ttl d">Pause</p><button class="go" data-a="resume">Reprendre</button><button class="lnk" data-a="quit">Quitter la partie</button></div></div>
</div>
</div>

function beep(f,d,type,vol){if(!opt.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={ok(){beep(660,.12);setTimeout(()=>beep(990,.2),100)},ko(){beep(150,.3,'sawtooth',.08)},tick(){beep(880,.05,'square',.04)},go(){beep(520,.1);setTimeout(()=>beep(780,.16),90)}};
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(70)}catch(e){}};

// Pioches sans répétition, mémorisées d'une partie à l'autre.
function deck(k,n){const all=()=>shuffle([...Array(n).keys()]);let L=all().filter(i=>!seen[k+i]);return()=>{if(!L.length){for(let i=0;i<n;i++)delete seen[k+i];L=all()}const i=L.pop();seen[k+i]=1;LS.set('tat_seen',seen);return i}}
const dQ=Q.map((c,k)=>deck('q'+k+'_',c.length)),dT=deck('t',TF.length),dE=deck('e',ES.length);
const asked=new Set,draw=(L,d)=>{let r,i=0;do r=L[d()];while(++i<9&&r.k&&asked.has(r.k));if(r.k)asked.add(r.k);return r};
const mcq=c=>{const r=draw(Q[c],dQ[c]);return Array.isArray(r)?{tag:CATS[c],q:r[0],a:r.slice(1),ok:0}:{tag:CATS[c],q:r.e?r.q.replace('ce drapeau','ce drapeau '+r.e):r.q,a:[r.ok,...wrongs(r)],ok:0}};
const tf=()=>{const r=draw(TF,dT),x=Array.isArray(r)?r:r.t();return{tag:'Vrai ou faux',q:x[0],a:['Vrai','Faux'],ok:x[1]?0:1,tf:1}};

// Espaces insécables avant ? ! : pour qu'aucun signe ne passe seul à la ligne.
const nb=s=>s.replace(/ ([?!:;»])/g,' $1').replace(/« /g,'« ');
const show=f=>{for(const p of[0,1]){const b=B(p);b.className='body';b.innerHTML=nb(f(p))}};
const chip=(p,t,c)=>{const e=B(p).querySelector('.chip');e.textContent=nb(t);e.className='chip'+(c?' '+c:'')};
function hud(){for(const p of[0,1]){const h=H(p),x=P[p],o=P[1-p],sc=h.querySelector('.sc');h.querySelector('.nm').innerHTML=x.n;if(sc.textContent!==String(x.s)){sc.textContent=x.s;sc.classList.remove('bump');void sc.offsetWidth;sc.classList.add('bump')}h.querySelector('.fl').hidden=x.st<3;h.querySelector('.rd').textContent=rdTxt;h.querySelector('.op').innerHTML=o.n+' · '+o.s}}

// Chrono : s'arrête en pause, se fige si l'appli passe en arrière-plan, meurt si on quitte la partie.
function countdown(ms,tick){const my=run;let left=ms,last=performance.now(),done;const p=new Promise(r=>done=r),id=setInterval(()=>{if(my!==run)return clearInterval(id);const now=performance.now();if(!paused)left-=Math.min(now-last,250);last=now;tick&&tick(Math.max(0,left),ms);if(left<=0){clearInterval(id);done()}},50);return{p,stop(){clearInterval(id);done()},get left(){return Math.max(0,left)}}}
function bar(l,t,idle){tb.style.transform='scaleX('+(idle?1-l/t:l/t)+')';tb.classList.toggle('idle',!!idle);const s=Math.ceil(l/1000);tb.classList.toggle('hot',!idle&&s<=3);if(!idle&&s<=3&&s>0&&s!==lastS)sfx.tick();lastS=idle?0:s}
const sleep=ms=>countdown(ms,(l,t)=>bar(l,t,1)).p;

function onTap(e){const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;if(a==='pz'||a==='resume'){paused=!paused;game.classList.toggle('paused',paused);return}if(a==='quit')return goHome();if(paused||!tap)return;const h=b.closest('.half');if(h)tap(+h.dataset.p,a,b,e)}
game.addEventListener('pointerdown',onTap);
game.addEventListener('click',e=>{if(e.detail===0)onTap(e)});
game.addEventListener('pointermove',e=>{if(drag[e.pointerId])drag[e.pointerId](e)});
for(const t of['pointerup','pointercancel'])game.addEventListener(t,e=>{delete drag[e.pointerId]});
game.addEventListener('contextmenu',e=>e.preventDefault());

const ready=f=>new Promise(res=>{const ok=[0,0];show(p=>f(p)+'<button class="go" data-a="rdy">Prêt</button>');tap=(p,a,el)=>{if(a!=='rdy'||ok[p])return;ok[p]=1;el.textContent='En attente de l’autre';el.classList.add('done');sfx.tick();if(ok[0]&&ok[1]){tap=null;sfx.go();res()}}});
const intro=(i,t,r)=>{rdTxt='Manche '+i+'/6';hud();bar(0,1);const d=P[0].s-P[1].s;return ready(p=>`<div class="chip">Manche ${i} sur 6${d?' · '+Math.abs(d)+' pts '+((d>0)===(p===0)?'d’avance':'de retard'):''}</div><div class="ttl d">${t}</div><p class="rule">${r}</p>`)};
const choose=(p,used)=>new Promise(res=>{const cs=shuffle([...CATS.keys()].filter(c=>c!==used)).slice(0,4);rdTxt='Manche 3';hud();bar(0,1);show(k=>k===p?`<div class="chip">Ton terrain</div><p class="q">Choisis ton thème. Tes bonnes réponses y comptent double.</p><div class="ans">${cs.map(c=>`<button data-a="${c}">${CATS[c]}</button>`).join('')}</div>`:`<div class="chip">Terrain adverse</div><p class="q">${P[p].n} choisit son thème.</p>`);tap=(k,a,el)=>{if(k!==p||!el.closest('.ans'))return;tap=null;sfx.go();res(+a)}});
const bets=c=>new Promise(res=>{const b=[0,0];bar(0,1);show(()=>`<div class="chip">${CATS[c]}</div><p class="q">Quitte ou double. Combien mises-tu sur ce thème ?</p><div class="ans three">${[10,25,50].map(v=>`<button data-a="${v}">${v}</button>`).join('')}</div>`);tap=(p,a,el)=>{if(b[p]||!el.closest('.ans'))return;b[p]=+a;B(p).querySelector('.ans').classList.add('wait');chip(p,'Mise verrouillée');sfx.tick();if(b[0]&&b[1]){tap=null;res(b)}}});

// Une question à choix. g : time, pts, pen, bonus (au plus rapide), first (buzzer), own (terrain d'un joueur), bet (mises).
async function ask(it,g){
  const ord=[0,1].map(()=>it.tf?[0,1]:shuffle([0,1,2,3])),st=[{},{}],an=p=>B(p).querySelector('.ans'),bt=(p,i)=>an(p).querySelector('[data-a="'+i+'"]');
  show(p=>`<div class="chip">${it.tag}${g.own===p?' · compte double':''}${g.bet?' · mise '+g.bet[p]:''}</div><p class="q">${it.q}</p><div class="ans${it.tf?' tf':''}">${ord[p].map(i=>`<button data-a="${i}">${it.a[i]}</button>`).join('')}</div>`);
  const cd=countdown(g.time,bar);
  tap=(p,a,el)=>{
    if(st[p].pick!=null||!el.closest('.ans')||el.classList.contains('out'))return;
    const i=+a;st[p].pick=i;st[p].t=(g.time-cd.left)/1e3;
    if(g.first){
      if(i===it.ok)return cd.stop();
      el.classList.add('ko');an(p).classList.add('lock');chip(p,'Raté, tu es bloqué','dn');bt(1-p,i).classList.add('out');sfx.ko();buzz();
    }else{an(p).classList.add('wait');chip(p,'Réponse verrouillée');sfx.tick()}
    if(st[1-p].pick!=null)cd.stop();
  };
  await cd.p;tap=null;
  const good=[0,1].map(p=>st[p].pick===it.ok),fast=good[0]&&good[1]?(st[0].t<=st[1].t?0:1):good[0]?0:good[1]?1:-1;
  for(const p of[0,1]){
    const x=P[p],pk=st[p].pick;let d=0,m;
    if(good[p]){
      x.ok++;x.best=Math.max(x.best,++x.st);x.fast=Math.min(x.fast,st[p].t);
      d=(g.bet?g.bet[p]:g.pts*(g.own===p?2:1))+(g.bonus&&fast===p?g.bonus:0)+(x.st>=3?5:0);
      m=sg(d)+' '+rnd(BRAVO)+(x.st>=3?' · série de '+x.st:'');
    }else{
      x.st=0;d=pk!=null?-(g.bet?g.bet[p]:g.pen||0):0;
      m=pk==null?(g.first&&good[1-p]?'Grillé sur le fil':'Trop tard'):(d?sg(d)+' ':'')+rnd(RATE);
    }
    x.s=Math.max(0,x.s+d);an(p).classList.remove('wait');an(p).classList.add('lock');bt(p,it.ok).classList.add('ok');if(pk!=null&&!good[p])bt(p,pk).classList.add('ko');
    chip(p,m,good[p]?'up':'dn');
  }
  hud();(good[0]||good[1]?sfx.ok:sfx.ko)();
  await sleep(it.tf?3000:4000);
}

// Le juste chiffre : curseur, le plus proche gagne.
async function estim(r){
  const[q,ans,mn,mx,sp,u]=r,dec=(String(sp).split('.')[1]||'').length,fmt=v=>u?v.toLocaleString('fr-FR',{minimumFractionDigits:dec,maximumFractionDigits:dec})+' '+u:String(v),fix=v=>+Math.min(mx,Math.max(mn,Math.round(v/sp)*sp)).toFixed(dec),v=[0,0].map(()=>fix((mn+mx)/2)),tc=[0,0],lk=[0,0];
  show(()=>`<div class="chip">De ${fmt(mn)} à ${fmt(mx)}</div><p class="q">${q}</p><div class="val"><button data-a="-" aria-label="Moins">−</button><output>?</output><button data-a="+" aria-label="Plus">+</button></div><div class="trk" data-a="t"><i style="left:50%"></i></div><button class="go" data-a="ok">Valider</button>`);
  const set=(p,x)=>{tc[p]=1;v[p]=fix(x);B(p).querySelector('output').textContent=fmt(v[p]);B(p).querySelector('.trk i').style.left=(v[p]-mn)/(mx-mn)*100+'%'};
  const cd=countdown(22e3,bar);
  tap=(p,a,el,e)=>{
    if(lk[p])return;
    if(a==='t'){const f=m=>{if(lk[p])return;const b=el.getBoundingClientRect();let k=(m.clientX-b.left)/b.width;if(p&&game.classList.contains('face'))k=1-k;set(p,mn+k*(mx-mn))};drag[e.pointerId]=f;f(e)}
    else if(a==='+'||a==='-')set(p,v[p]+(a==='+'?sp:-sp));
    else if(a==='ok'&&tc[p]){lk[p]=1;B(p).classList.add('lk');el.textContent='Validé';el.classList.add('done');sfx.tick();if(lk[1-p])cd.stop()}
  };
  await cd.p;tap=null;for(const k in drag)delete drag[k];
  const d=v.map((x,p)=>tc[p]?Math.abs(x-ans):Infinity),w=d[0]===d[1]?-1:d[0]<d[1]?0:1;
  for(const p of[0,1]){
    const win=d[p]<Infinity&&(w<0||w===p),bull=d[p]<=sp*1.001,g=win?20+(bull?10:0):0,b=B(p);
    P[p].s+=g;b.classList.add('lk');
    b.querySelector('.go').outerHTML=`<div class="sol d">Réponse : ${fmt(ans)}</div>`;
    b.querySelector('.trk').insertAdjacentHTML('beforeend',`<u style="left:${(ans-mn)/(mx-mn)*100}%"></u>`);
    chip(p,win?sg(g)+' '+(bull?'Pile dessus':'Le plus proche'):tc[p]?'Trop loin':'Pas de réponse',win?'up':'dn');
  }
  hud();sfx.ok();await sleep(5500);
}

function end(){
  const d=P[0].s-P[1].s,w=d?(d>0?0:1):-1,g=rnd(GAGES);rdTxt='Score final';hud();bar(0,1);sfx.ok();setTimeout(sfx.ok,350);
  show(p=>`<div class="chip">${P[p].ok} bonnes réponses · série max ${P[p].best}${P[p].fast<99?' · éclair '+P[p].fast.toFixed(1).replace('.',',')+' s':''}</div><div class="ttl d">${w<0?'Égalité parfaite':w===p?'Victoire':'Défaite'}</div><p class="rule">${w<0?'Personne ne lâche rien. La revanche s’impose.':w===p?`Tu gagnes de ${Math.abs(d)} points. Gage pour ${P[1-p].n} : ${g}.`:`Il te manque ${Math.abs(d)} points. Ton gage : ${g}.`}</p><div class="ans"><button data-a="re">Revanche</button><button data-a="home">Accueil</button></div>`);
  tap=(p,a)=>{if(a==='re')go();else if(a==='home')goHome()};
}
function goHome(){run++;paused=false;tap=null;game.classList.remove('paused');game.hidden=true;home.hidden=false}

async function play(){asked.clear();
  run++;paused=false;tap=null;for(const x of P)Object.assign(x,{s:0,ok:0,st:0,best:0,fast:99});
  home.hidden=true;game.hidden=false;game.classList.remove('paused');game.classList.toggle('face',!!opt.face);
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
  const N=x=>Math.max(2,Math.round(x*opt.f)),cyc=shuffle([...CATS.keys()]);let ci=0,used=-1;
  const cat=()=>cyc[ci++%cyc.length],loop=async(i,n,fn)=>{for(let k=0;k<n;k++){rdTxt='Manche '+i+' · '+(k+1)+'/'+n;hud();await fn()}};
  await intro(1,'Échauffement','Vous répondez tous les deux, chacun de son côté. Bonne réponse : +10. Le plus rapide des deux : +5. À partir de trois bonnes réponses de suite, chaque réponse juste rapporte 5 de plus.');
  await loop(1,N(15),()=>ask(mcq(cat()),{time:18e3,pts:10,bonus:5}));
  await intro(2,'Vrai ou faux éclair','Huit secondes par affirmation. Juste : +10. Faux : −5. Dans le doute, ne touche à rien.');
  await loop(2,N(18),()=>ask(tf(),{time:8e3,pts:10,pen:5}));
  await intro(3,'Chacun son terrain','Chacun choisit un thème, celui qui est derrière commence. Sur ton terrain, tes bonnes réponses comptent double : +20 au lieu de +10.');
  const fst=P[0].s<=P[1].s?0:1;
  for(const p of[fst,1-fst]){const c=used=await choose(p,used);await loop(3,N(8),()=>ask(mcq(c),{time:18e3,pts:10,own:p}))}
  await intro(4,'Le juste chiffre','Glisse le curseur au plus près de la bonne réponse, ajuste avec + et −, puis valide. Le plus proche : +20. Pile dessus : 10 de plus.');
  await loop(4,N(7),()=>estim(ES[dE()]));
  await intro(5,'Le buzzer','Le premier qui trouve prend +20 et la question s’arrête. Une erreur coûte 10 points, te bloque, et élimine ta mauvaise réponse chez l’adversaire.');
  await loop(5,N(15),()=>ask(mcq(cat()),{time:15e3,pts:20,pen:10,first:1}));
  await intro(6,'Quitte ou double','La finale. Tu vois le thème, tu mises 10, 25 ou 50. Juste : tu gagnes ta mise. Faux : tu la perds.');
  await loop(6,N(5),async()=>{const c=cat(),b=await bets(c);await ask(mcq(c),{time:2e4,bet:b})});
  end();
}
const go=()=>play().catch(e=>console.error(e));

// Accueil
[0,1].forEach(i=>{$('#n'+i).value=names[i]||''});
for(const s of document.querySelectorAll('.seg')){const k=s.dataset.k,sync=()=>{for(const b of s.children){const on=+b.dataset.v===opt[k];b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)}};s.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;opt[k]=+b.dataset.v;LS.set('tat_opt',opt);sync()});sync()}
$('#start').addEventListener('click',()=>{[0,1].forEach(i=>{names[i]=$('#n'+i).value.trim();P[i].n=esc(names[i]||'Joueur '+(i+1))});LS.set('tat_names',names);sfx.go();go()});
</script>
