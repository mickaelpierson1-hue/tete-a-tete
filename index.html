<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tête-à-Tête Télé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  /* Plan : la même affiche de combat, portée sur deux écrans. La télé est la scène, encre noire et très grands caractères, pilotée en rem pour tenir sur tout écran 16:9. Chaque téléphone est un aplat à la couleur de son joueur. */
  --encre:#15161c;--papier:#fffaf0;--ok:#2fcf7f;--ko:#ff5c61;
  --c0:#ff4b3e;--c1:#62b6ff;--c2:#ffc93c;--c3:#b9a2ff;--c4:#74e0c4;--c5:#ff9ccf;
  --display:"Anton","Arial Narrow",Impact,sans-serif;
  --body:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html.tv{font-size:min(1.55vw,2.75vh)}
body{overflow:hidden;overscroll-behavior:none;background:var(--encre);color:var(--encre);font:600 17px/1.25 var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid currentColor;outline-offset:2px}
.d{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.chip{align-self:flex-start;display:inline-flex;align-items:center;min-height:28px;padding:2px 10px;border:3px solid var(--encre);border-radius:4px;background:var(--encre);color:var(--papier);font-size:13.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.chip.up,.chip.dn{min-height:36px;color:var(--encre);font:400 22px/1 var(--display);letter-spacing:.03em}
.chip.up{background:var(--ok)}
.chip.dn{background:var(--ko)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shr{to{transform:scaleX(0)}}

/* Choix du rôle */
#home{position:absolute;inset:0;overflow:auto;display:grid;grid-template-rows:auto 1fr 1fr auto;max-width:720px;margin:0 auto}
.band{background:var(--encre);color:var(--papier);padding:18px 20px}
h1{font-size:clamp(44px,13vw,84px)}
h1 span{color:var(--c0)}
.band p{margin-top:8px;font-weight:500;font-size:16px;max-width:44ch}
.role{display:grid;align-content:center;gap:8px;padding:22px 20px;text-align:left}
.role.b{background:var(--c1)}
.role.a{background:var(--c0)}
.role span{font-size:clamp(36px,10vw,60px)}
.role small{font-size:16px;font-weight:600;max-width:36ch}
.role[disabled]{opacity:.5;cursor:default}
#net{background:var(--encre);color:var(--papier);padding:12px 20px 16px;font-weight:500;font-size:15px}
#net a{color:var(--c0)}

/* Manette */
#ph{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;padding:10px 16px 16px;background:var(--c,var(--papier));touch-action:none}
#ph header{display:flex;align-items:flex-end;gap:10px}
.nm{font-size:22px;padding-bottom:3px}
.sc{font-size:40px;font-variant-numeric:tabular-nums}
.side{margin-left:auto;padding-bottom:6px;text-align:right;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
#ppz{align-self:center;width:46px;height:32px;border-radius:16px;background:var(--papier);border:3px solid var(--encre);display:grid;place-items:center}
#ppz::before{content:"";width:12px;height:12px;border-left:4px solid var(--encre);border-right:4px solid var(--encre)}
#ptb{height:8px;border-radius:4px;background:rgba(21,22,28,.18);overflow:hidden}
#ptb i{display:block;height:100%;background:var(--encre);transform-origin:left;animation:shr linear forwards}
.paused #ptb i{animation-play-state:paused}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.q,.rule{flex:1;min-height:0;display:flex;align-items:center;font-size:clamp(17px,3vh,24px);font-weight:700;line-height:1.18;text-wrap:balance}
.rule{align-items:flex-start;font-weight:600;font-size:clamp(15px,2.5vh,19px);line-height:1.25}
.ttl{font-size:clamp(34px,7vh,60px);text-wrap:balance}
.name{display:grid;gap:5px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
input{width:100%;padding:8px 12px;border:3px solid var(--encre);border-radius:6px;background:var(--papier);color:var(--encre);font:400 28px/1.25 var(--display);text-transform:uppercase;letter-spacing:.02em;-webkit-user-select:text;user-select:text}
.seg{display:grid;grid-template-columns:1fr 1fr;border:3px solid var(--encre);border-radius:6px;overflow:hidden;background:var(--papier)}
.seg button{padding:11px 6px;font-weight:700;font-size:16px}
.seg button.on{background:var(--encre);color:var(--papier)}
.ans{display:grid;gap:10px}
.ans button,.val button{background:var(--papier);border:3px solid var(--encre);border-radius:6px;box-shadow:0 3px 0 var(--encre)}
.ans button{display:flex;align-items:center;gap:12px;min-height:clamp(50px,9.5vh,84px);padding:6px 14px;text-align:left;font-weight:700;font-size:clamp(16px,2.6vh,21px);line-height:1.1}
.ans button b{min-width:.8em;font:400 26px/1 var(--display)}
.ans button:active,.val button:active{transform:translateY(3px);box-shadow:none}
.ans.tf,.ans.two{grid-template-columns:1fr 1fr}
.ans.three{grid-template-columns:repeat(3,1fr)}
.ans.two button{justify-content:center}
.ans.tf button,.ans.three button{justify-content:center;min-height:clamp(90px,22vh,200px);font:400 clamp(30px,5vh,44px)/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.ans.lock button{pointer-events:none;box-shadow:none;transform:translateY(3px)}
.ans.lock button:not(.ok):not(.ko):not(.sel){opacity:.4}
.ans button.sel{background:var(--encre);color:var(--papier)}
.ans button.ok{background:var(--ok);color:var(--encre);animation:pop .4s}
.ans button.ko{background:var(--ko);color:var(--encre)}
.ans button.out{opacity:.35;text-decoration:line-through;pointer-events:none;box-shadow:none}
.val{display:flex;align-items:center;gap:10px}
.val button{width:64px;height:50px;font:700 32px/1 var(--body)}
.val output{flex:1;text-align:center;font:400 clamp(36px,7vh,56px)/1 var(--display);font-variant-numeric:tabular-nums}
.trk{position:relative;height:44px;margin:0 16px}
.trk::before{content:"";position:absolute;left:-16px;right:-16px;top:18px;height:8px;border-radius:4px;background:var(--encre)}
.trk i{position:absolute;top:6px;width:32px;height:32px;margin-left:-16px;border-radius:50%;background:var(--papier);border:3px solid var(--encre);box-shadow:0 3px 0 var(--encre)}
.trk u{position:absolute;top:0;width:12px;height:44px;margin-left:-6px;border-radius:3px;background:var(--ok);border:3px solid var(--encre)}
.lk .trk i,.lk .val button{opacity:.6}
.go{min-height:56px;padding:8px 12px;border-radius:6px;background:var(--encre);color:var(--papier);font:400 26px/1 var(--display);text-transform:uppercase;letter-spacing:.05em}
.go.done{opacity:.5}
.sol{min-height:56px;display:grid;place-items:center;border:3px solid var(--encre);border-radius:6px;background:var(--ok);font-size:26px}
.lnk{padding:10px;font-weight:700;text-decoration:underline}
#ppo{position:absolute;inset:0;z-index:5;display:none;place-items:center;background:rgba(21,22,28,.88)}
.paused #ppo{display:grid}
#ppo>div{display:grid;gap:12px;width:min(300px,84%);padding:22px;border-radius:8px;background:var(--papier);text-align:center}

/* Écran télé */
#tv{position:absolute;inset:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;background:var(--encre);color:var(--papier);font-size:1rem}
#ttw{height:.7rem;background:rgba(255,250,240,.14)}
#ttb{height:100%;background:var(--papier);transform-origin:left;transform:scaleX(0)}
#ttb.hot{background:var(--ko)}
#ttb.idle{opacity:.35}
#thd{display:flex;justify-content:space-between;align-items:center;padding:.7rem 2.5rem 0;font-size:1.1rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
#stage{display:flex;flex-direction:column;justify-content:center;gap:1.1rem;min-height:0;padding:.8rem 2.5rem}
#stage h1{font-size:6.5rem}
#tv .chip{min-height:2rem;padding:.15rem .8rem;border:0;background:var(--papier);color:var(--encre);font-size:1.1rem}
.lead{max-width:36em;font-size:1.8rem;font-weight:600;line-height:1.3}
.sub{font-size:1.2rem;font-weight:500;opacity:.7}
.big{font-size:5.6rem;text-wrap:balance}
.tq{max-width:26em;font-size:2.7rem;font-weight:700;line-height:1.15;text-wrap:balance}
.ta{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.tc{display:flex;align-items:center;gap:1rem;min-height:4.6rem;padding:.5rem 1.2rem;border-radius:.5rem;background:var(--papier);color:var(--encre);font-size:1.8rem;font-weight:700;line-height:1.1}
.tc>b{min-width:1.1em;font-size:2.3rem}
.tc.ok{background:var(--ok);animation:pop .4s}
.tc.dim{opacity:.6}
.tc.out{opacity:.3;text-decoration:line-through}
.tc em{display:flex;gap:.3rem;margin-left:auto;font-style:normal}
.tc u{display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--c);border:.2rem solid var(--encre);font:400 1.3rem/1 var(--display);text-decoration:none;text-transform:uppercase}
.ta.tf .tc{justify-content:center;min-height:7.5rem;font:400 3.8rem/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.ta.tf .tc em{margin-left:1rem}
.line{position:relative;height:.8rem;margin:9rem 5rem 5rem;border-radius:.4rem;background:var(--papier)}
.line i{position:absolute;bottom:100%;font-style:normal;height:calc(1.2rem + var(--o,0)*2.7rem);border-left:.25rem solid var(--c)}
.line i b{position:absolute;bottom:100%;left:0;transform:translateX(-50%);padding:.2rem .7rem;border-radius:.4rem;background:var(--c);color:var(--encre);font-size:1.5rem;font-weight:700;white-space:nowrap}
.line i.sol{--c:var(--ok);bottom:auto;top:100%;height:1.2rem}
.line i.sol b{bottom:auto;top:100%;font-size:2.4rem;font-weight:400}
.rk{display:grid;gap:.6rem}
.rr{display:grid;grid-template-columns:3rem 1fr auto auto;align-items:baseline;gap:0 1.2rem;padding:.5rem 1.2rem;border-radius:.5rem;background:var(--c);color:var(--encre);font-size:2.6rem}
.rr small{font-size:1rem;font-weight:600}
.rr em{min-width:3em;text-align:right;font-style:normal}
.rk.many .rr{padding:.25rem 1.2rem;font-size:2rem}
.row{display:flex;gap:.8rem;flex-wrap:wrap}
.tbtn{padding:.5rem 1.2rem;border-radius:.4rem;background:var(--c0);color:var(--encre);font:400 1.5rem/1.2 var(--display);text-transform:uppercase;letter-spacing:.04em}
.tbtn.alt{background:none;color:var(--papier);box-shadow:inset 0 0 0 .15rem var(--papier)}
.tbtn.sm{padding:.25rem .8rem;font-size:1rem}
#board{display:flex;gap:.9rem;padding:.6rem 2.5rem 1.2rem}
.fin #board{display:none}
.tile{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;align-items:center;gap:.1rem .8rem;padding:.5rem 1rem;border-radius:.5rem;background:var(--c);color:var(--encre)}
.tile.off{opacity:.4}
.tn{font-size:1.5rem;overflow-wrap:anywhere}
.ts{grid-row:span 2;font-size:2.8rem;font-variant-numeric:tabular-nums}
.tb{justify-self:start;min-height:1.7rem;font-size:1rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tb.up,.tb.dn{padding:.1rem .5rem;border-radius:.3rem;font:400 1.4rem/1.2 var(--display)}
.tb.up{background:var(--ok)}
.tb.dn{background:var(--ko)}
#tpz{position:absolute;inset:0;display:none;place-items:center;background:rgba(21,22,28,.92)}
.paused #tpz{display:grid}
#tpz>div{display:grid;justify-items:center;gap:1.2rem}
@media (prefers-reduced-motion:reduce){.tc.ok,.ans button.ok{animation:none}}
/* Nouveautés : rouge contre bleu, mascotte, blind test, visuels, repères. Une mauvaise réponse se signale en encre, plus en rouge, pour rester lisible sur fond rouge. */
.chip{line-height:1.2}
.chip.dn,.ans button.ko,.tb.dn{background:var(--encre);color:var(--papier)}
.ans button.ko::before{content:"✗";font:400 22px/1 var(--display)}
#ph{padding-top:20px}
#ph header{min-height:78px}
.who{display:flex;align-items:flex-end;gap:10px;min-width:0;margin-right:auto}
#pm{flex:none;width:78px;height:78px}
#prd{min-height:16px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pemo{font-size:44px;line-height:1.1;letter-spacing:.12em}
.trk{margin-bottom:20px}
.trk s{position:absolute;top:8px;width:6px;height:28px;margin-left:-3px;border-radius:2px;background:var(--papier);border:2px solid var(--encre)}
.trk s b{position:absolute;top:100%;left:50%;transform:translateX(-50%);padding-top:4px;font-size:12.5px;font-weight:700;white-space:nowrap}
.sh{display:block;width:100%;height:100%;overflow:visible}
.sh .cap,.sh .ft,.sh .eye{fill:var(--encre)}
.sh .hl{fill:none;stroke:var(--papier);stroke-width:5;stroke-linecap:round}
.sh .stem{fill:var(--papier);stroke:var(--encre);stroke-width:4}
.sh .bl{fill:#ff9ccf}
.sh .m1,.sh .m2,.sh .br{fill:none;stroke:var(--encre);stroke-width:3.2;stroke-linecap:round}
.sh .m2,.sh .br,.sh.sad .m1{display:none}
.sh.sad .m2,.sh.sad .br{display:inline}
.sh.sad .fc{transform:translate(3px,3px)}
.sh .sj{transform-box:fill-box;transform-origin:50% 100%;animation:bob 2.6s ease-in-out infinite}
.sh.joy .sj{animation:hop .55s ease-in-out 5}
.sh.sad .sj{animation:sulk .6s ease-out forwards}
@keyframes bob{50%{transform:scale(1.04,.96)}}
@keyframes hop{0%,100%{transform:translateY(0)}15%{transform:translateY(0) scale(1.12,.86)}50%{transform:translateY(-28%) scale(.94,1.08)}85%{transform:translateY(0) scale(1.08,.92)}}
@keyframes sulk{to{transform:rotate(-10deg) scale(1.05,.9)}}
.vz,.qa{display:grid;gap:1.1rem;min-width:0}
.emo{font-size:6rem;line-height:1.1;letter-spacing:.15em}
.line{flex:none;margin:10.5rem 7rem 5.5rem}
.line.pre{margin-top:3rem}
.line i{height:calc(1.1rem + var(--o,0)*2.3rem)}
.line i.ref{--c:var(--papier);bottom:auto;top:100%;height:calc(1rem + var(--o,0)*2.2rem)}
.line i.ref b{bottom:auto;top:100%;background:none;color:var(--papier);box-shadow:inset 0 0 0 .12rem var(--papier);font-size:1.25rem}
.line i.sol{bottom:100%;top:auto;height:calc(1.1rem + 6.9rem)}
.line i.sol b{bottom:100%;top:auto}
.tile{grid-template-columns:auto 1fr auto}
.tm{grid-row:span 2;width:3.4rem;height:3.4rem}
.rr{grid-template-columns:3rem 3rem 1fr auto auto;align-items:center}
.rm{width:3rem;height:3rem}
.rk.many .rm{width:2.2rem;height:2.2rem}
@media (prefers-reduced-motion:reduce){.sh .sj{animation:none}}
.lob{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2.5rem}
.lobl{display:grid;gap:1.1rem}
#stage .lob h1{font-size:5rem}
.qrb{display:grid;justify-items:center;gap:.7rem;width:15rem;text-align:center}
.qr{display:block;width:15rem;height:15rem;border-radius:.5rem}
/* Personnages au choix, réglages sonores, partie à code hors de Claude. */
.sh .ik{fill:var(--encre)}
.sh .pp{fill:var(--papier);stroke:var(--encre);stroke-width:4;stroke-linejoin:round}
.sh .ln{fill:none;stroke:var(--encre);stroke-width:4;stroke-linecap:round}
.avs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:2px}
.avs button{height:clamp(46px,8.4vh,66px);padding:3px;border:3px solid var(--encre);border-radius:8px;background:var(--papier);box-shadow:0 3px 0 var(--encre)}
.avs button.on{box-shadow:0 0 0 3px var(--papier),0 0 0 6px var(--encre);transform:translateY(3px)}
.avs .sh .sj{animation:none}
.avs .on .sh .sj{animation:bob 1.3s ease-in-out infinite}
.sp{flex:1;min-height:0}
.row2{display:flex;justify-content:space-between;gap:8px}
.hb{display:flex;gap:.5rem}
body.solo #home{grid-template-rows:auto 1fr auto 1fr auto}
body.solo #rTv{order:1}body.solo #cdw{order:2}body.solo #rPh{order:3}body.solo #net{order:4}
#cdw{display:grid;gap:6px;padding:14px 20px 14px;background:var(--encre);color:var(--papier);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
#cd{letter-spacing:.3em;text-align:center}
.qrb .big{font-size:4.2rem;letter-spacing:.14em;line-height:1}
.seg.four{grid-template-columns:repeat(4,1fr)}
.cfb{display:flex;align-items:center;gap:10px;padding:8px 12px;border:3px solid var(--encre);border-radius:6px;background:var(--papier);box-shadow:0 3px 0 var(--encre);text-align:left;font-weight:700;font-size:15px;line-height:1.25}
.cfb span{font-size:26px;line-height:1}.cfb small{display:block;font-size:12.5px;font-weight:600;opacity:.7}
.cfm{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:2px}
.cfm button{min-height:44px;padding:5px 8px;border:3px solid var(--encre);border-radius:6px;background:var(--papier);font-weight:700;font-size:15px;line-height:1.15;letter-spacing:0;text-transform:none;opacity:.5}
.cfm button.on{background:var(--encre);color:var(--papier);opacity:1}
.cfm button.on::before{content:"✓ "}
.lobl .chip{justify-self:start}
.cfl{align-items:center;gap:.7rem 1rem}.cfl .sub,.cft{font-size:1.3rem;font-weight:600;opacity:.85}.cft{margin-bottom:-.5rem}.cfr+.cft{margin:0}
.lobl>.row .tbtn{padding:.45rem 1rem;font-size:1.2rem}.lobl>.cfl .tbtn{padding:.5rem 1.2rem;font-size:1.5rem}
.cfr{gap:.55rem}.cfr .tbtn{padding:.32rem .8rem;font-size:1.05rem}
#tpt{max-width:92vw;text-align:center}#tps{max-width:30em;text-align:center}#tps:empty{display:none}
.wait #tpt{font-size:3.4rem}.wait #tpz [data-a="pz"]{display:none}
@media (prefers-reduced-motion:reduce){.avs .on .sh .sj{animation:none}}
</style>
</head>
<body>
<main id="home">
  <section class="band">
    <h1 class="d">Tête-à-tête <span>télé</span></h1>
    <p>La télé affiche les questions, chacun répond sur son téléphone. De 1 à 6 joueurs.</p>
  </section>
  <button class="role b" id="rTv" disabled><span class="d">Écran télé</span><small>À choisir sur l’appareil relié à la télé. Il affiche les questions et les scores.</small></button>
  <button class="role a" id="rPh" disabled><span class="d">Manette</span><small>À choisir sur chaque téléphone. Il sert à répondre.</small></button>
  <label id="cdw" for="cd" hidden>Code affiché sur la télé<input id="cd" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" placeholder="ABCD"></label>
  <p id="net">Connexion au salon en cours.</p>
</main>
<div id="tv" hidden>
  <div id="ttw"><div id="ttb"></div></div>
  <div id="thd"><span id="trd"></span><span class="hb"><button class="tbtn alt sm" data-a="mu" id="bmu">Musique</button><button class="tbtn alt sm" data-a="sn" id="bsn">Sons</button><button class="tbtn alt sm" data-a="pz">Pause</button></span></div>
  <div id="stage"></div>
  <div id="board"></div>
  <div id="tpz"><div><p class="big d" id="tpt">Pause</p><p class="lead" id="tps"></p><button class="tbtn" data-a="pz">Reprendre</button><button class="tbtn alt" data-a="qt">Retour au salon</button></div></div>
</div>
<div id="ph" hidden>
  <header><div class="who"><span class="nm d" id="pnm"></span><span class="sc d" id="psc"></span></div><span id="pm"></span><button id="ppz" data-a="pz" aria-label="Pause"></button></header>
  <div id="prd"></div>
  <div id="ptb"></div>
  <div class="body" id="pb"></div>
  <div id="ppo"><div><p class="ttl d">Pause</p><button class="go" data-a="pz">Reprendre</button><button class="lnk" data-a="snd" id="pps"></button><button class="lnk" data-a="qt">Terminer la partie</button></div></div>
</div>

function hostPeers(peers){
  if(role!=='host')return;let ch=false;const here=new Set,sigs=[];
  for(const pr of peers){
    if(pr.kind!=='viewer')continue;const ps=pr.presence||{};
    if(ps.h&&!pr.sameTab&&ps.g>gid){leave();net.textContent='Un autre écran télé a pris la main.';return}
    if(!ps.p||typeof ps.d!=='string'||!/^p[a-z0-9]{3,12}$/.test(ps.d)||here.has(ps.d))continue;
    let pl=players.find(x=>x.d===ps.d);
    if(!pl){if(players.length>=6)continue;pl={d:ps.d,nm:'',av:0,s:0,ok:0,st:0,best:0,fast:99,on:true,go:+ps.go||0,pz:+ps.pz||0,qt:+ps.qt||0,cn:+ps.cn||0,la:''};players.push(pl);ch=true;sfx.join()}
    here.add(pl.d);
    const nm=(typeof ps.nm==='string'?ps.nm.trim().slice(0,12):'')||'Joueur '+(players.indexOf(pl)+1);if(nm!==pl.nm){pl.nm=nm;ch=true}
    const av=ps.av>=0&&ps.av<AV.length?ps.av|0:0;if(av!==pl.av){pl.av=av;ch=true}
    if(ps.cn>pl.cn){pl.cn=ps.cn;if(cfOk(ps.cf)&&!running){opt={q:ps.cf.q,r:ps.cf.r};LS.set('tat_cfg',opt);ch=true}}
    for(const t of['go','pz','qt'])if(ps[t]>pl[t]){pl[t]=ps[t];sigs.push(t)}
    const a=ps.a;if(a&&a.n===view.n&&onAns){const key=view.n+':'+JSON.stringify(a.v)+(a.ok?'!':'');if(pl.la!==key){pl.la=key;onAns(pl,a.v,a)}}
  }
  // Les départs sont annoncés une fois tous les états à jour : si tout le monde décroche en même temps, la question en cours reste ouverte.
  const gone=[];for(const pl of players){const on=here.has(pl.d);if(on!==pl.on){pl.on=on;ch=true;(on?sfx.join:sfx.leave)();if(!on)gone.push(pl)}}
  for(const pl of gone)if(onLeave)onLeave(pl);
  if(view.k==='lobby'&&players.some(p=>!p.on)){players=online();ch=true}
  // Plus aucun téléphone relié : la partie attend, puis reprend d'elle-même dès qu'un joueur revient.
  if(running&&!paused&&!online().length){paused=autoPz=true;ch=true}
  else if(running&&paused&&autoPz&&online().length){paused=autoPz=false;ch=true;sfx.resume()}
  if(ch)pub();
  for(const t of sigs)sig(t);
}
function sig(t){
  if(role!=='host')return;
  if(t==='go'){if(!running&&players.length)play().catch(e=>console.error(e))}
  else if(t==='pz'){if(running){paused=!paused;autoPz=false;(paused?sfx.pause:sfx.resume)();pub()}}
  else if(t==='qt'){run++;running=false;paused=autoPz=false;onAns=onLeave=null;players=online();rd='';tvBar(0,1);setV({k:'lobby'})}
  else if(t==='cfg'){if(!running){tvCfg=!tvCfg;sfx.pop();tv()}}
  else if(/^n\d+$/.test(t)){const q=+t.slice(1);if(!running&&NQ.includes(q)){opt.q=q;LS.set('tat_cfg',opt);sfx.pop();pub()}}
  else if(/^m\d$/.test(t)){const r=(opt.r^1<<+t[1])&255;if(!running&&r){opt.r=r;LS.set('tat_cfg',opt);sfx.pop();pub()}}
  else if(t==='mu'){musOn=musOn?0:1;LS.set('tat_mus',musOn);musStart();tv()}
  else if(t==='sn'){snd=snd?0:1;LS.set('tat_snd',snd);sfx.pop();tv()}
  else if(t==='role')leave();
}

async function intro(i,of,t,r){
  rd='Manche '+i+'/'+of;tvBar(0,1);setV({k:'intro',i,of,t,r,done:[]});sfx.round(i);
  const cd=countdown(3e4),check=()=>{if(all(p=>view.done.includes(p.d)))cd.stop()};
  onAns=(pl,v)=>{if(v!=='rdy'||view.done.includes(pl.d))return;view.done.push(pl.d);sfx.tick();pub();check()};onLeave=check;
  await cd.p;onAns=onLeave=null;sfx.go();
}
async function choose(pl,used){
  const cs=shuffle([...CATS.keys()].filter(c=>!used.includes(c))).slice(0,4),dur=pl.on||!online().length?2e4:1;let c=cs[0];
  setV({k:'pick',who:pl.d,cs,dur});
  const cd=countdown(dur,tvBar);
  onAns=(p,v)=>{if(p!==pl||!cs.includes(v))return;c=v;cd.stop()};onLeave=p=>{if(p===pl&&online().length)cd.stop()};
  await cd.p;onAns=onLeave=null;sfx.pick();return c;
}
async function bets(c){
  const b={};setV({k:'bet',tag:CATS[c],dur:15e3,done:[]});
  const cd=countdown(15e3,tvBar),check=()=>{if(all(p=>b[p.d]))cd.stop()};
  onAns=(pl,v)=>{if(b[pl.d]||![10,25,50].includes(v))return;b[pl.d]=v;view.done.push(pl.d);sfx.coin();pub();check()};onLeave=check;
  await cd.p;onAns=onLeave=null;for(const p of players)if(!b[p.d])b[p.d]=p.on?10:0;return b;
}
// Une question à choix. g : time, pts, pen, bonus (au plus rapide), first (buzzer), own (terrain d'un joueur), bet (mises).
// La question peut porter des émojis (emo) : ce sont les rébus.
async function ask(it,g){
  const ord=it.tf?[0,1]:shuffle([0,1,2,3]),A=ord.map(i=>it.a[i]),okI=ord.indexOf(it.ok),st={};let winner=null;
  setV({k:'q',tag:it.tag,q:it.q,a:A,tf:it.tf?1:0,emo:it.emo||null,dur:g.time,first:g.first?1:0,own:g.own||null,bets:g.bet||null,out:[],done:[],lock:[]});sfx.q();
  const cd=countdown(g.time,tvBar),check=()=>{if(all(p=>st[p.d]))cd.stop()};
  onAns=(pl,v)=>{
    if(st[pl.d]||typeof v!=='number'||!(v>=0&&v<A.length)||view.out.includes(v))return;
    st[pl.d]={pk:v,t:(g.time-cd.left)/1e3};
    if(g.first){
      if(v===okI){winner=pl;sfx.buzz();return cd.stop()}
      view.out.push(v);view.lock.push(pl.d);sfx.ko();
    }else{view.done.push(pl.d);sfx.tick()}
    pub();check();
  };
  onLeave=check;
  await cd.p;onAns=onLeave=null;
  const good=p=>!!st[p.d]&&st[p.d].pk===okI,res={};let fast=null;
  for(const p of players)if(good(p)&&(!fast||st[p.d].t<st[fast.d].t))fast=p;
  for(const p of players){
    const s=st[p.d];let d=0,m;
    if(good(p)){
      p.ok++;p.best=Math.max(p.best,++p.st);p.fast=Math.min(p.fast,s.t);
      d=(g.bet?g.bet[p.d]||0:g.pts*(g.own===p.d?2:1))+(g.bonus&&fast===p?g.bonus:0)+(p.st>=3?5:0);
      m=sg(d)+' '+rnd(BRAVO)+(p.st>=3?' · série de '+p.st:'');
    }else{
      p.st=0;d=s?-(g.bet?g.bet[p.d]||0:g.pen||0):0;
      m=!s?(winner?'Grillé sur le fil':p.on?'Trop tard':'Hors ligne'):(d?sg(d)+' ':'')+rnd(RATE);
    }
    p.s=Math.max(0,p.s+d);res[p.d]={pk:s?s.pk:-1,d,g:good(p)?1:0,m};
  }
  const late=!winner&&cd.left<=0&&online().some(p=>!st[p.d]);if(late)sfx.time();
  view=Object.assign({},view,{k:'rev',ok:okI,res});pub();
  setTimeout(()=>{(players.some(good)?sfx.ok:sfx.sad)();if(players.some(p=>good(p)&&p.st===3))setTimeout(sfx.streak,450)},late?380:winner?300:0);
  await sleep(it.tf?3500:4500);
}
// L'ordre de grandeur : chacun place son curseur par rapport à deux repères, le plus proche gagne.
async function estim(){
  const[gi,q,ans]=OGI[dO()],[u,mn,mx,sp,ra,va,rb,vb]=OG[gi],st={};
  setV({k:'es',q,mn,mx,sp,u,refs:[[ra,va],[rb,vb]],dur:3e4,done:[]});
  const cd=countdown(3e4,tvBar),check=()=>{if(all(p=>st[p.d]&&st[p.d].ok))cd.stop()};
  onAns=(pl,v,a)=>{if(typeof v!=='number'||!(v>=mn&&v<=mx)||(st[pl.d]&&st[pl.d].ok))return;st[pl.d]={v,ok:a.ok?1:0};if(a.ok){view.done.push(pl.d);sfx.tick();pub();check()}};onLeave=check;
  await cd.p;onAns=onLeave=null;
  const dist=p=>st[p.d]?Math.abs(st[p.d].v-ans):Infinity,best=Math.min(Infinity,...players.map(dist)),res={};
  for(const p of players){const d=dist(p),win=d<Infinity&&d===best,bull=d<=sp*1.001,g=win?20+(bull?10:0):0;p.s+=g;res[p.d]={v:st[p.d]?st[p.d].v:null,d:g,g:win?1:0,m:win?sg(g)+' '+(bull?'Pile dessus':'Le plus proche'):d<Infinity?'Trop loin':'Pas de réponse'}}
  sfx.roll();await sleep(1000);view=Object.assign({},view,{k:'esrev',ans,res});pub();sfx.tada();await sleep(7000);
}
function endGame(){
  running=false;const rank=[...players].sort((a,b)=>b.s-a.s),top=rank.length?rank[0].s:0,last=rank[rank.length-1],stats={};
  for(const p of players)stats[p.d]={ok:p.ok,best:p.best};
  rd='Score final';tvBar(0,1);setV({k:'end',rank:rank.map(p=>p.d),top,loser:rank.length>1&&last.s<top?last.d:null,gage:rnd(GAGES),stats});
  sfx.win();
}
async function play(){
  run++;paused=autoPz=tvCfg=false;running=true;asked.clear();sfx.start();for(const p of players)Object.assign(p,{s:0,ok:0,st:0,best:0,fast:99});
  const sel=cfMan(opt),nq=opt.q,cyc=shuffle([...CATS.keys()]);let ci=0,m=0;
  const cat=()=>cyc[ci++%cyc.length],loop=async(n,fn)=>{for(let k=0;k<n;k++){rd='Manche '+m+' · '+(k+1)+'/'+n;await fn(k)}};
  for(const i of sel){
    m++;await intro(m,sel.length,MAN[i][0],MAN[i][1]);
    if(i===0)await loop(nq,()=>ask(mcq(cat()),{time:2e4,pts:10,bonus:5}));
    else if(i===1)await loop(nq,()=>ask(tf(),{time:8e3,pts:10,pen:5}));
    else if(i===2)await loop(nq,()=>ask(mcq(cat()),{time:15e3,pts:20,pen:10,first:1}));
    else if(i===3){
      // Chacun son terrain : les questions de la manche sont partagées entre les joueurs, le dernier au score choisit d'abord.
      const order=[...players].sort((a,b)=>a.s-b.s),per=Math.max(1,Math.ceil(nq/Math.max(1,order.length))),tot=per*order.length,used=[];let k=0;
      for(const p of order){const c=await choose(p,used);used.push(c);for(let j=0;j<per;j++){rd='Manche '+m+' · '+(++k)+'/'+tot;await ask(mcq(c),{time:2e4,pts:10,own:p.d})}}
    }
    else if(i===4)await loop(nq,()=>estim());
    else if(i===5)await loop(nq,()=>ask(rebus(),{time:2e4,pts:10,bonus:5}));
    else if(i===6)await loop(nq,()=>ask(mcq(cat()),{time:15e3,pts:30,pen:15,first:1}));
    else await loop(nq,async()=>{const c=cat(),b=await bets(c);await ask(mcq(c),{time:2e4,bet:b})});
  }
  endGame();
}

// Accès par QR code : la télé affiche un code qui ouvre directement la manette (#manette). Le dessin vient de la bibliothèque qrcode-generator, chargée en fin de page ; sans elle, le salon s'affiche sans code.
const LINK='https://claude.ai/artifact/Ke1DR14tYLrNCha7Lnjern#manette';
function qrSvg(text){
  try{
    if(typeof qrcode!=='function')return'';
    const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount();let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+='M'+c+' '+r+'h1v1h-1z';
    return`<svg class="qr" viewBox="-3 -3 ${n+6} ${n+6}" shape-rendering="crispEdges" role="img" aria-label="QR code qui ouvre la manette"><rect x="-3" y="-3" width="${n+6}" height="${n+6}" fill="#fffaf0"/><path d="${d}" fill="#15161c"/></svg>`;
  }catch(e){return''}
}

  switch(v.k){
  case'intro':return[has(v.done)?'Prêt':'','',''];
  case'q':return[has(v.lock)?'Bloqué':has(v.done)?'A répondu':'','',has(v.lock)?'sad':''];
  case'bet':return[has(v.done)?'A misé':'','',''];

  case'pick':return[v.who===d?'Choisit':'','',''];

  }return['','',''];
}

  if(a==='pz'||a==='qt'||a==='go')return room.presence({[a]:Date.now()}).catch(warn);

    if(has&&mine.ok)return;const dec=(String(v.sp).split('.')[1]||'').length,fix=x=>+Math.min(v.mx,Math.max(v.mn,Math.round(x/v.sp)*v.sp)).toFixed(dec),cur=has?mine.v:fix((v.mn+v.mx)/2);

// ───── Liaison hors de Claude. Quand la page est hébergée ailleurs (GitHub Pages par exemple), il n'y a pas de salon Claude : la télé ouvre une partie à code et les téléphones la rejoignent sans compte.
// Les appareils ne se parlent pas directement (les box et les réseaux mobiles bloquent souvent ces liaisons) : chacun passe par des relais publics de messagerie, en simple connexion sortante, ce qui fonctionne sur tous les réseaux.
// Plusieurs relais servent en même temps (quatre serveurs MQTT et un service en HTTPS ordinaire) : un message part sur tous, le premier arrivé est retenu, les doublons sont écartés par leur numéro. Un seul relais joignable suffit.
// L'objet rendu a la même interface que le salon (presence, peers, onPeers).
let SOLO=!(window.claude&&claude.use);const framed=()=>{try{return self!==top}catch(e){return true}};
// Un relais : adresse, puis identifiant et mot de passe publics s'il en demande. « pubnub » désigne le service en HTTPS, avec ses clés de démonstration.
const RELAIS=window.__relais||['wss://public.cloud.shiftr.io|public|public','wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt','pubnub|demo|demo'];
let code='',busy=false;
const wait=ms=>new Promise(r=>setTimeout(r,ms)),hashCode=()=>{const m=/^#([A-Za-z]{4})$/.exec(location.hash);return m?m[1].toUpperCase():''};
const newCode=()=>{let s='';for(let i=0;i<4;i++)s+='ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0];return s};

const rid=n=>{let s='';while(s.length<n)s+=Math.random().toString(36).slice(2);return s.slice(0,n)};

// Client MQTT 3.1.1 réduit à l'essentiel : connexion avec message de départ (testament), abonnement, publication sans accusé, entretien de la ligne, reconnexion.
function mqtt(url,o){
  const te=new TextEncoder,td=new TextDecoder;let ws=null,up=false,dead=false,buf=new Uint8Array(0),ping=0,seen=0,tries=0,timer=0;
  const str=s=>{const b=te.encode(s),r=new Uint8Array(2+b.length);r[0]=b.length>>8;r[1]=b.length&255;r.set(b,2);return r};
  const cat=a=>{let n=0;for(const x of a)n+=x.length;const r=new Uint8Array(n);n=0;for(const x of a){r.set(x,n);n+=x.length}return r};
  const pkt=(h,parts)=>{const body=cat(parts),len=[];let l=body.length;do{let d=l%128;l=(l-d)/128;if(l)d|=128;len.push(d)}while(l);return cat([[h],len,body])};
  const send=p=>{try{if(ws&&ws.readyState===1){ws.send(p);return true}}catch(e){}return false};
  const down=()=>{clearInterval(ping);const was=up;up=false;try{ws&&ws.close()}catch(e){}ws=null;buf=new Uint8Array(0);if(was)o.state(false);if(!dead){clearTimeout(timer);timer=setTimeout(open,Math.min(8000,700*2**tries++))}};
  function take(p){
    const t=p[0]>>4;
    if(t===2){if(p[p.length-1]!==0)return down();up=true;tries=0;seen=Date.now();
      if(o.subs.length)send(pkt(0x82,[[0,1],...o.subs.flatMap(s=>[str(s),[0]])]));
      clearInterval(ping);ping=setInterval(()=>{if(Date.now()-seen>11000)return down();send(new Uint8Array([0xC0,0]))},5000);o.state(true)}
    else if(t===3){let i=1;while(p[i++]&128);const n=p[i]<<8|p[i+1],topic=td.decode(p.subarray(i+2,i+2+n));o.msg(topic,td.decode(p.subarray(i+2+n+((p[0]>>1&3)?2:0))))}

    buf=buf.length?cat([buf,c]):c;
    for(;;){
      if(buf.length<2)return;let l=0,m=1,i=1,d;
      do{if(i>=buf.length)return;if(i>4)return down();d=buf[i++];l+=(d&127)*m;m*=128}while(d&128);
      if(buf.length<i+l)return;const p=buf.subarray(0,i+l);buf=buf.slice(i+l);try{take(p)}catch(e){console.error(e)}

    w.onopen=()=>{if(w!==ws)return;const wl=o.will;send(pkt(0x10,[str('MQTT'),[4,2|(wl?4|(wl.retain?32:0):0)|(o.user?192:0),0,10],str('tat'+rid(12)),...(wl?[str(wl.topic),str(wl.msg)]:[]),...(o.user?[str(o.user),str(o.pass||'')]:[])]))};

    w.onclose=w.onerror=()=>{clearTimeout(late);if(w===ws)down()};
  }

  return{get up(){return up},pub:(topic,msg,retain)=>up&&send(pkt(0x30|(retain?1:0),[str(topic),te.encode(msg)])),
    // Réveil : on rouvre tout de suite une ligne tombée, et on vérifie qu'une ligne restée muette répond encore.
    kick(){if(dead)return;tries=0;if(!ws){clearTimeout(timer);open()}else if(up&&Date.now()-seen>4000){const w=ws;send(new Uint8Array([0xC0,0]));setTimeout(()=>{if(w===ws&&Date.now()-seen>6500)down()},2600)}},
    close(){dead=true;clearTimeout(timer);clearInterval(ping);send(new Uint8Array([0xE0,0]));const w=ws;ws=null;setTimeout(()=>{try{w&&w.close()}catch(e){}},300);up=false}};

// Relais en HTTPS ordinaire : une écoute longue sur un canal, des envois sur l'autre. Seul le dernier état compte, les envois en attente sont donc remplacés plutôt qu'empilés.
function pubnub(keys,T,isHost,cid,o){
  const B='https://ps.pndsn.com/',ch=k=>(T+k).replace(/\//g,'-'),hear=ch(isHost?'p':'h'),url=([k,i,m])=>{let v=m;if(m[0]==='{')try{v=JSON.parse(m)}catch(e){}return`${B}publish/${keys[0]}/${keys[1]}/0/${ch(k)}/0/${encodeURIComponent(JSON.stringify({i,m:v}))}?uuid=${cid}`};
  let up=false,dead=false,tt='0',tr='',fails=0,ctl=null,going=false,pend=null,lastM='',lastT=0;
  // Une requête qui ne répond plus (ligne coupée sans prévenir) est abandonnée au bout d'un délai, sinon elle bloquerait la suite pour de bon.
  const limit=(c,ms,f)=>setTimeout(()=>{f&&f();try{c.abort()}catch(e){}},ms);
  (async()=>{
    while(!dead){
      let mute=false;const c=ctl=new AbortController,wd=limit(c,15000,()=>{mute=true});
      try{
        const r=await fetch(`${B}v2/subscribe/${keys[1]}/${hear}/0?tt=${tt}${tr?'&tr='+tr:''}&uuid=${cid}`,{signal:c.signal,cache:'no-store'});if(!r.ok)throw 0;
        const j=await r.json();clearTimeout(wd);if(dead)return;tt=j.t.t;tr=j.t.r;fails=0;if(!up){up=true;o.state(true)}
        for(const x of j.m||[]){const d=x.d;if(d&&typeof d.i==='string')o.msg(T+(d.i==='h'?'h':'p/'+d.i),typeof d.m==='string'?d.m:JSON.stringify(d.m))}
      }catch(e){clearTimeout(wd);if(dead)return;if(mute)continue;if(++fails>1&&up){up=false;o.state(false)}await wait(Math.min(8000,900*fails))}
    }
  })();
  async function flush(){
    if(going||!pend||dead)return;going=true;const p=pend,c=new AbortController,wd=limit(c,7000);pend=null;
    try{await fetch(url(p),{cache:'no-store',keepalive:true,signal:c.signal})}catch(e){}
    clearTimeout(wd);await wait(150);going=false;flush();
  }
  return{get up(){return up},kick(){if(dead)return;fails=0;try{ctl&&ctl.abort()}catch(e){}},
    pub(topic,m){if(!m||dead)return;const k=topic.slice(T.length),now=Date.now();if(m===lastM&&now-lastT<2400)return;lastM=m;lastT=now;pend=k==='h'?['h','h',m]:['p',k.slice(2),m];flush()},
    close(){if(dead)return;dead=true;up=false;if(pend)try{fetch(url(pend),{cache:'no-store',keepalive:true}).catch(()=>{})}catch(e){}try{ctl&&ctl.abort()}catch(e){}}};
}

function direct(code,isHost){
  return new Promise((done,nope)=>{
    const T='tatq/1/'+code+'/',me={peer:'moi',isMe:true,sameTab:true,kind:'viewer',presence:{}},tele={peer:'tele',isMe:false,sameTab:false,kind:'viewer',presence:{}},others=new Map,subs=[];
    const cid=rid(10),ses=Date.now().toString(36)+rid(4),mine=T+(isHost?'h':'p/'+cid);let seq=0,dead=false,started=false,iv=0,hs='',hq=0,ht=0;
    const emit=()=>{const c={peers:[me,...others.values()]};for(const f of subs)try{f(c)}catch(e){console.error(e)}};
    const snap=()=>JSON.stringify({s:ses,q:seq,p:me.presence}),tell=(m,retain)=>{for(const l of links)l.pub(mine,m,retain)};
    const room={
      presence(p){Object.assign(me.presence,p);seq++;tell(snap(),isHost);return Promise.resolve()},
      peers:()=>[me,...others.values()],
      onPeers(f){subs.push(f)},
      up:()=>links.filter(l=>l.up).length,
      // Réveil de toutes les lignes, puis rappel de son propre état. Au revoir : prévient les autres sans fermer (la page peut revenir).
      kick(){if(dead)return;for(const l of links)l.kick();if(seq)setTimeout(()=>{if(!dead)tell(snap(),isHost)},800)},
      bye(){if(dead)return;if(isHost)tell(JSON.stringify({s:ses,q:++seq,bye:1}));else tell('x')},
      close(){if(dead)return;dead=true;clearInterval(iv);if(isHost){tell(JSON.stringify({s:ses,q:++seq,bye:1}));tell('',true)}else tell('x');for(const l of links)l.close()}
    };
    function msg(topic,m){
      if(dead)return;const now=Date.now();
      if(isHost){
        // La télé écoute chaque téléphone sur son propre fil. Un fil vide annonce une coupure possible (un seul relais peut avoir lâché) : le téléphone est écarté s'il ne redonne pas signe de vie.
        if(topic.slice(0,T.length+2)!==T+'p/')return;const id=topic.slice(T.length+2);let o=others.get(id);
        if(m==='x'){if(o){others.delete(id);emit()}return}
        if(!m){if(o)o.t=Math.min(o.t,now-8000);return}
        let d;try{d=JSON.parse(m)}catch(e){return}if(!d||typeof d.p!=='object'||!d.p)return;
        if(!o){o={peer:id,isMe:false,sameTab:false,kind:'viewer',presence:{},q:-1,t:now,raw:''};others.set(id,o)}
        o.t=now;let ch=false;
        // Un téléphone rechargé revient sous un nouveau fil : l'ancien, resté muet, lui cède la place.
        if(d.p.d)for(const x of[...others.values()])if(x!==o&&x.presence.d===d.p.d&&now-x.t>3200){others.delete(x.peer);ch=true}
        if(d.q>o.q){o.q=d.q;const raw=JSON.stringify(d.p);if(raw!==o.raw){o.raw=raw;o.presence=d.p;ch=true}}
        if(ch)emit();
      }else{
        if(topic!==T+'h'||!m)return;let d;try{d=JSON.parse(m)}catch(e){return}if(!d)return;
        if(d.s!==hs){if(hs&&d.s<hs)return;hs=d.s;hq=-1}
        if(d.bye){if(d.q>hq){hq=d.q;ht=0;if(others.delete('tele')){tele.presence={};emit()}}return}
        if(typeof d.p!=='object'||!d.p)return;ht=now;if(!(d.q>hq)){if(!others.has('tele')&&d.q===hq){tele.presence=d.p;others.set('tele',tele);emit()}return}
        hq=d.q;tele.presence=d.p;others.set('tele',tele);emit();
      }
    }
    const links=RELAIS.map(r=>{const[u,a,b]=r.split('|'),o={subs:[T+(isHost?'p/+':'h')],will:{topic:mine,msg:'',retain:isHost},user:a,pass:b,msg,
      state(on){if(dead)return;if(on){for(const x of links)if(x.up&&!x.told){x.told=1;if(seq)x.pub(mine,snap(),isHost)}if(!started){started=true;done(room)}}else for(const x of links)if(!x.up)x.told=0;if(started)emit()}};return u==='pubnub'?pubnub([a,b],T,isHost,cid,o):mqtt(u,o)});
    // Veille : chacun redit régulièrement son état (un message perdu est ainsi rattrapé), la télé écarte les téléphones muets, le téléphone constate le silence de la télé.
    iv=setInterval(()=>{
      if(dead)return;const now=Date.now();if(seq)tell(snap(),isHost);
      if(isHost){let ch=false;for(const o of[...others.values()])if(now-o.t>12000){others.delete(o.peer);ch=true}if(ch)emit()}
      else if(others.has('tele')&&now-ht>12000){others.delete('tele');emit()}
    },2500);
    setTimeout(()=>{if(!started&&!dead){dead=true;clearInterval(iv);for(const l of links)l.close();const e=new Error('relais');e.code='relais';nope(e)}},12000);
  });
}
const trd=()=>{$('#trd').textContent=rd+(SOLO&&room&&room.up&&!room.up()?(rd?' · ':'')+'liaison coupée, reconnexion en cours':'')};
const onPeers=c=>{if(role==='host'){hostPeers(c.peers);trd()}else if(role==='phone')ph();else status()};
async function soloHost(c){
  if(busy||role)return;busy=true;net.textContent='Ouverture de la partie.';const k=c||newCode();
  try{room=await direct(k,true);code=k}catch(e){busy=false;net.textContent='Impossible d’ouvrir la partie : aucun relais n’a répondu. Vérifie la connexion Internet de cet appareil, puis réessaie.';return}
  busy=false;SS.set('tat_code',code);room.onPeers(onPeers);beHost();
}
async function soloPhone(c){
  c=String(c||'').toUpperCase().replace(/[^A-Z]/g,'');
  if(c.length!==4){net.textContent='Saisis le code à 4 lettres affiché sur la télé, puis touche Manette.';try{$('#cd').focus()}catch(e){}return}
  if(busy||role)return;busy=true;net.textContent='Connexion à la partie '+c+'.';
  try{room=await direct(c,false);code=c}catch(e){busy=false;net.textContent='Connexion impossible : aucun relais n’a répondu. Vérifie la connexion Internet de ce téléphone, puis réessaie.';return}
  busy=false;SS.set('tat_code',c);room.onPeers(onPeers);bePhone();
}
function soloBoot(){
  document.body.classList.add('solo');$('#cdw').hidden=false;$('#rTv').disabled=$('#rPh').disabled=false;
  net.innerHTML='Aucun compte nécessaire : la télé ouvre une partie, les téléphones la rejoignent avec son code. <a href="un-telephone.html">Jouer à deux sur un seul téléphone</a>';
  const h=hashCode(),w=SS.get('tat_role'),c=SS.get('tat_code');
  if(w==='host'&&c&&!h)soloHost(c);else if(h||(w==='phone'&&c)){$('#cd').value=h||c;soloPhone(h||c)}
  addEventListener('hashchange',()=>{const h=hashCode();if(h&&!role){$('#cd').value=h;soloPhone(h)}});
  $('#cd').addEventListener('keydown',e=>{if(e.key==='Enter')soloPhone($('#cd').value)});
}

// ───── Salon et choix du rôle
function devId(){
  const taken=id=>room.peers().some(p=>!p.sameTab&&p.presence&&p.presence.d===id),l=LS.get('tat_dev',null);let s=SS.get('tat_dev');
  if(s&&taken(s))s=null;
  const id=s||(typeof l==='string'&&!taken(l)?l:'p'+(Math.random().toString(36)+'000000').slice(2,8));
  SS.set('tat_dev',id);if(typeof l!=='string')LS.set('tat_dev',id);return id;
}
function status(){if(!room||role)return;const ps=room.peers(),n=Math.max(1,ps.length);net.textContent='Salon connecté · '+n+(n>1?' appareils':' appareil')+' sur cette page.'+(ps.some(p=>p.presence&&p.presence.h&&!p.sameTab)?' Un écran télé est déjà ouvert.':'')}
function leave(){
  if(role==='host'){run++;running=false;paused=autoPz=false;onAns=onLeave=null}
  role=null;SS.set('tat_role',null);tvEl.hidden=phEl.hidden=true;home.hidden=false;document.documentElement.classList.remove('tv');pkey='';musSet();
  if(room)room.presence({h:null,g:null,v:null,p:null,d:null,a:null,nm:null,av:null}).catch(warn);
  if(SOLO&&room){room.close();room=null;code='';SS.set('tat_code',null);net.textContent='Partie quittée. Choisis un rôle pour recommencer.'}
  status();
}
function fail(e){
  const c=e&&e.code||'';if(c==='invalid_argument'||c==='upstream_error'||c==='limit_reached')return;
  if(SOLO){leave();net.textContent='Liaison interrompue'+(c?' ('+c+')':'')+'. Vérifie la connexion Internet, puis choisis de nouveau un rôle.';return}
  leave();room=null;$('#rTv').disabled=$('#rPh').disabled=true;
  net.innerHTML='Salon indisponible'+(c?' ('+esc(c)+')':'')+'. Ouvre cette page dans Claude sur chaque appareil, avec le compte du propriétaire ou un compte qu’il a invité. Un simple lien public ne donne pas accès au salon. <a href="https://claude.ai/artifact/Ce4jryheXfoqRdPnnTUGTi">Jouer à deux sur un seul téléphone</a>';
}
function beHost(){
  role='host';SS.set('tat_role','host');gid=Date.now();players=[];paused=running=false;rd='';
  home.hidden=true;tvEl.hidden=false;document.documentElement.classList.add('tv');wake();sfx.go();musStart();
  room.presence({p:null,d:null,a:null,nm:null,av:null}).catch(warn);tvBar(0,1);setV({k:'lobby'});hostPeers(room.peers());
}
function bePhone(){
  role='phone';SS.set('tat_role','phone');dev=devId();mine={};pkey='';home.hidden=true;phEl.hidden=false;wake();
  room.presence({h:null,g:null,v:null,p:1,d:dev,nm:pname,av:myAv}).catch(warn);ph();
}
$('#rTv').addEventListener('click',()=>{if(SOLO)soloHost();else if(room)beHost()});
$('#rPh').addEventListener('click',()=>{if(SOLO)soloPhone($('#cd').value);else if(room)bePhone()});
(async()=>{
  // Dans Claude la page est affichée dans un cadre : si l'outil de salon tarde à s'installer, on l'attend un instant avant de conclure qu'on est hors de Claude.
  if(SOLO&&framed())for(let i=0;i<12&&SOLO;i++){await wait(150);SOLO=!(window.claude&&claude.use)}
  if(SOLO)return soloBoot();
  try{room=await claude.use('room')}catch(e){room=null}
  if(!room)return fail();
  $('#rTv').disabled=$('#rPh').disabled=false;status();
  room.onPeers(onPeers,fail);
  // Arrivée par le QR code de la télé : l'adresse porte #manette, on ouvre la manette sans passer par le choix du rôle.
  const viaQr=()=>location.hash==='#manette',w=SS.get('tat_role')||(viaQr()?'phone':null);if(w==='host')beHost();else if(w==='phone')setTimeout(()=>{if(!role&&room)bePhone()},1200);
  addEventListener('hashchange',()=>{if(viaQr()&&!role&&room)bePhone()});
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" async onload="typeof tv==='function'&&role==='host'&&tv()"></script>
